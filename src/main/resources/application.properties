spring.application.name=appointment-service
server.port=8081

# Config Server Requirement Bypass
spring.config.import=optional:configserver:http://localhost:8888

# Eureka Service Discovery Disable (Local Test)
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/appointment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Asd713@#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configs
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect